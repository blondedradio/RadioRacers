name: Build radioracers and radioracers_plus files

on:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Init Python 
        uses: actions/setup-python@v5
        with: 
            python-version: '3.x'

      - name: Build radioracers.pk3
        run: python radio/pk3/pk3make.py radio/pk3/build/radioracers.txt --force -o radio/pk3/out/radioracers.pk3 -b radio/pk3/src/radioracers

      - name: Build radioracers_plus.pk3
        run: python radio/pk3/pk3make.py radio/pk3/build/radioracers_plus.txt --force -o radio/pk3/out/radioracers_plus.pk3 -b radio/pk3/src/radioracers_plus

      - name: Zip the assets
        run: |
          cd radio/pk3/out
          zip radioracers_assets.zip radioracers.pk3 radioracers_plus.pk3
          mv radioracers_assets.zip ../../

      # Just print a directory tree of the radioracers folder

      - name: Get tree 
        run: sudo apt-get install -y tree
      
      - name: Generate release notes
        run: |
          cat << EOF > release_notes.md
          Built on **$(date +'%Y-%m-%d %H:%M:%S')**  

          ### Assets:
          - **radioracers.pk3**
          \`\`\`
          $(tree radio/pk3/src/radioracers)
          \`\`\`

          - **radioracers_plus.pk3**
          \`\`\`
          $(tree radio/pk3/src/radioracers_plus)
          \`\`\`
          EOF
        
      - name: Upload radioracers and radioracers_plus as github release
        uses: softprops/action-gh-release@v2
        with:
            tag_name: latest-radio-rassets
            token: ${{ secrets.GITHUB_TOKEN }}
            files: radioracers_assets.zip
            body_path: release_notes.md
          